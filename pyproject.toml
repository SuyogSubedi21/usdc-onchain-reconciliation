[project]
name = "crypto-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.16.1",
    "dbt-snowflake>=1.12.4",
    "pyspark>=4.2.1",
    "python-dotenv>=1.2.4",
